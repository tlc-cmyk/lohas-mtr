<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6B2D8B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="康城站實時列車倒數 — LOHAS Park MTR next train" />
  <title>康城站 · 下一班車</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="line-badge" aria-hidden="true">TKL</div>
      <div class="header-text">
        <h1>康城站</h1>
        <p class="subtitle">將軍澳綫 · LOHAS Park</p>
      </div>
      <button type="button" id="refreshBtn" class="refresh-btn" aria-label="立即更新" title="立即更新">
        <span class="refresh-icon" aria-hidden="true">↻</span>
      </button>
    </header>

    <main class="main">
      <section class="hero" id="hero" aria-live="polite">
        <p class="hero-label">下一班開出</p>
        <div class="countdown" id="mainCountdown">
          <span class="digits" id="mainDigits">--:--</span>
        </div>
        <p class="hero-dest" id="mainDest">載入中…</p>
        <p class="hero-meta" id="mainMeta"></p>
      </section>

      <section class="list-section" aria-labelledby="listTitle">
        <h2 id="listTitle" class="section-title">即將開出</h2>
        <ul class="train-list" id="trainList">
          <li class="train-item skeleton">載入列車資料…</li>
        </ul>
      </section>

      <section class="status-bar" id="statusBar">
        <p class="status-line" id="statusLine">正在連接港鐵開放數據…</p>
        <p class="status-hint" id="statusHint"></p>
      </section>
    </main>

    <footer class="footer">
      <p>資料來源：港鐵 Next Train 開放數據（data.gov.hk）</p>
      <p>更新約每 10 秒 · 倒數每秒刷新</p>
      <p class="caveat">康城為支線終點，列車只往調景嶺／北角方向開出。開出時間為估計值，請以站內顯示為準。</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
